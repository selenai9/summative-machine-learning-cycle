events { worker_connections 1024; }

http {
    # "api" is the Docker service name; with --scale api=N Docker returns N addresses and nginx
    # spreads requests across them (round robin).
    upstream api_containers {
        server api:8000;
    }

    server {
        listen 80;
        client_max_body_size 100m;

        location / {
            proxy_pass http://api_containers;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
        }
    }
}
