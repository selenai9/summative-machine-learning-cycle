# Load-test setup: nginx in front of N identical API containers.
#   docker compose -f docker-compose.scale.yml up --build --scale api=3 -d
# Then send traffic to http://localhost:8080 (nginx shares it between the containers).
services:
  api:
    build: .
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
