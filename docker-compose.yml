# Everyday use: one API container + the UI.
#   docker compose up --build
# API docs: http://localhost:8000/docs      UI: http://localhost:8501
services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data        # uploads, database and training data survive restarts
      - ./models:/app/models    # the current model; retraining writes new versions here
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped
